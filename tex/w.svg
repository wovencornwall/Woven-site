<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 92" role="img" aria-label="W">
  <g fill="currentColor">
    <!-- left V: thick down-stroke, then a hairline back up -->
    <path d="M9.6 7 L21.4 7 L41.6 85.4 L38.4 85.4 Z"/>
    <!-- right V: thick down-stroke -->
    <path d="M45.2 7 L57 7 L77.2 85.4 L74 85.4 Z"/>
    <path d="M74.2 85.4 L76.8 85.4 L107.8 7 L105.2 7 Z"/>
    <!-- hairline serifs -->
    <path d="M3 6 L28 6 L28 7.3 L3 7.3 Z"/>
    <path d="M40 6 L62.2 6 L62.2 7.3 L40 7.3 Z"/>
    <path d="M97.5 6 L115.5 6 L115.5 7.3 L97.5 7.3 Z"/>
    <path d="M65.4 6 L76.4 6 L76.4 7.3 L65.4 7.3 Z"/>
  </g>
  <!-- the left V's hairline passes over the right V's thick stroke, as a thread would -->
  <path d="M38.6 85.4 L41.2 85.4 L71.8 7 L69.2 7 Z" fill="currentColor" stroke="var(--knock, #FAF8F5)" stroke-width="1.6" paint-order="stroke"/>
</svg>